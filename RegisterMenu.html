<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-POT & SNACKS | Menu Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background: #FFFBF5; color: #5D4037; }
        .container { max-width: 900px; margin: 40px auto; padding: 20px; }
        header { background: #8D6E63; color: white; padding: 15px 0; text-align: center; }
        .logo-main { font-size: 2.8rem; font-weight: 900; }
        .logo-main .big-t { color: #FFD700; font-size: 3.5rem; }

        .admin-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #8D6E63; margin-bottom: 30px; }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #D7CCC8;
            border-radius: 8px;
            font-size: 1rem;
        }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #8D6E63; }
        .btn {
            background: #8D6E63;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 20px;
            font-weight: 600;
        }
        .btn:hover { background: #5D4037; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .success { color: #2E7D32; text-align: center; margin-top: 15px; font-weight: bold; }

        /* Days checkboxes group */
        .days-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 10px 0;
        }
        .days-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
            cursor: pointer;
        }
        .days-group input {
            width: auto;
            margin: 0;
        }

        /* ===== IMAGE UPLOAD UI (upload-only) ===== */
        .image-panel {
            grid-column: 1 / -1;
            border: 1px dashed #D7CCC8;
            border-radius: 10px;
            padding: 16px;
            background: #FFFBF5;
        }
        .image-panel .row {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .image-preview {
            width: 150px; height: 110px;
            border-radius: 8px;
            background: #F5EFE6 center/cover no-repeat;
            flex: none;
            border: 1px solid #D7CCC8;
            display: grid; place-items: center;
            color: #A1887F; font-size: .8rem; text-align: center; padding: 6px;
        }
        .image-controls { flex: 1; min-width: 220px; }
        .file-drop {
            display: block; padding: 14px; border: 1px dashed #A1887F;
            border-radius: 8px; background: #fff; text-align: center;
            color: #8D6E63; cursor: pointer; font-size: .9rem;
        }
        .file-drop.dragover { background: #F5EFE6; }
        .file-drop input { display: none; }
        .upload-status {
            font-size: .85rem; margin-top: 8px; color: #8D6E63;
        }
        .upload-status.error { color: #D32F2F; font-weight: 600; }
        .upload-status.ok    { color: #2E7D32; font-weight: 600; }
        .progress {
            height: 6px; background: #F5EFE6; border-radius: 3px; overflow: hidden; margin-top: 8px;
            display: none;
        }
        .progress > div {
            height: 100%; width: 0; background: #A1887F; transition: width .2s ease;
        }
        .progress.active { display: block; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo-main"><span class="big-t">T</span>-POT &amp; SNACKS <span style="font-size:1.2rem;">ADMIN</span></div>
        </div>
    </header>

    <div class="container">
        <div class="admin-card">
            <h2>Add New Menu Item</h2>
            <form id="menuForm">
                <div class="form-grid">

                    <!-- ==== IMAGE PANEL (upload only) ==== -->
                    <div class="image-panel">
                        <label>Dish Image *</label>
                        <div class="row">
                            <div class="image-preview" id="regImagePreview">No image</div>
                            <div class="image-controls">
                                <label class="file-drop" id="regFileDrop">
                                    <input type="file" id="regImageFile" accept="image/*">
                                    <i class="fas fa-cloud-arrow-up"></i>
                                    <span id="regFileDropText">Click or drop an image here (max 5 MB)</span>
                                </label>
                                <div class="progress" id="regUploadProgress"><div></div></div>
                                <div class="upload-status" id="regUploadStatus"></div>
                            </div>
                        </div>
                        <input type="hidden" id="image">
                    </div>

                    <div><label>Name *</label><input type="text" id="name" required></div>
                    <div><label>Price (e.g. ₦1,500) *</label><input type="text" id="price" required></div>
                    <div><label>Category *</label>
                        <select id="category" required>
                            <option value="signature">Signature</option>
                            <option value="snacks">Snacks</option>
                            <option value="main">Main Courses</option>
                            <option value="Tea">Tea</option>
                            <option value="soups">Soups</option>
                            <option value="drinks">Drinks</option>
                        </select>
                    </div>
                    <div><label>Serving Size</label><input type="text" id="serving" placeholder="1-2 persons"></div>

                    <div><label>Prep Time</label>
                        <select id="prepTime">
                            <option value="10-15 mins">10-15 mins</option>
                            <option value="15-20 mins" selected>15-20 mins</option>
                            <option value="20-30 mins">20-30 mins</option>
                            <option value="30-45 mins">30-45 mins</option>
                            <option value="45-60 mins">45-60 mins</option>
                        </select>
                    </div>

                    <div><label>Spice Level</label>
                        <select id="spiceLevel">
                            <option value="None">None</option>
                            <option value="Mild">Mild</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="Hot">Hot</option>
                        </select>
                    </div>
                    <div><label>Popularity</label><input type="text" id="popularity" value="★★★★☆"></div>

                    <div><label>Days Available</label>
                        <div class="days-group" id="daysGroup">
                            <label><input type="checkbox" value="Monday"> Mon</label>
                            <label><input type="checkbox" value="Tuesday"> Tue</label>
                            <label><input type="checkbox" value="Wednesday"> Wed</label>
                            <label><input type="checkbox" value="Thursday"> Thu</label>
                            <label><input type="checkbox" value="Friday"> Fri</label>
                            <label><input type="checkbox" value="Saturday"> Sat</label>
                            <label><input type="checkbox" value="Sunday"> Sun</label>
                        </div>
                    </div>

                    <div><label>Order Time</label><input type="text" id="orderTime" placeholder="e.g., 8:00 AM - 10:00 PM"></div>
                    <div><label>Tags (comma separated)</label><input type="text" id="tags" placeholder="Spicy,Popular,Best Seller"></div>
                </div>

                <div style="margin-top:20px;">
                    <label>Description *</label>
                    <textarea id="description" rows="4" style="width:100%;" required></textarea>
                </div>

                <div style="margin-top:15px;">
                    <label><input type="checkbox" id="available" checked> Available Today</label>
                </div>

                <button type="submit" class="btn" id="submitBtn">SAVE TO DATABASE</button>
                <button type="button" id="seedBtn" class="btn" style="background:#A1887F; margin-left:10px;">Seed Sample Data</button>
            </form>
            <p id="status" class="success"></p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        // ============== FIREBASE SETUP ==============
        const firebaseConfig = {
            apiKey: "AIzaSyDRKWldl8_NSAek4na-H-SQWjUBrxt26iI",
            authDomain: "tpot.com.ng",
            projectId: "t-pot-60c3d",
            storageBucket: "t-pot-60c3d.firebasestorage.app",
            messagingSenderId: "272048176539",
            appId: "1:272048176539:web:d73d09a39171c8ef12753e"
        };
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const form = document.getElementById('menuForm');
        const status = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');

        // ============== IMAGE URL HELPERS ==============
        const GITHUB_RAW_BASE = "https://raw.githubusercontent.com/bajmathfoundation-dot/TPOT-images/main/";
        const PLACEHOLDER = GITHUB_RAW_BASE + 'dishes/placeholder.jpg';

        function resolveImageUrl(v) {
            if (!v || typeof v !== 'string') return PLACEHOLDER;
            const s = v.trim();
            if (!s) return PLACEHOLDER;
            if (/^https?:\/\/raw\.githubusercontent\.com\//i.test(s)) return s;
            const blob = s.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/([^/]+)\/(.+)$/i);
            if (blob) {
                const [, u, r, b, p] = blob;
                return `https://raw.githubusercontent.com/${u}/${r}/${b}/${p}`;
            }
            if (/^https?:\/\//i.test(s)) return s;
            const clean = s.replace(/^\/+/, '');
            return clean.includes('/') ? GITHUB_RAW_BASE + clean : GITHUB_RAW_BASE + 'dishes/' + clean;
        }

        // ============== UPLOAD (diagnostic + one retry) ==============
        async function uploadToGitHub(file, suggestedName) {
            if (file.size > 5 * 1024 * 1024) {
                throw new Error('Image is larger than 5 MB. Please compress it first.');
            }

            const fd = new FormData();
            fd.append('image', file);
            fd.append('dishName', suggestedName || file.name.replace(/\.[^.]+$/, ''));

            async function attempt() {
                let res;
                try {
                    res = await fetch('/api/upload', { method: 'POST', body: fd });
                } catch (netErr) {
                    const e = new Error(
                        'Could not reach the upload server (/api/upload). ' +
                        'This page must be served by your deployed backend (e.g. Vercel), ' +
                        'not opened as a local file. (' + (netErr.message || netErr) + ')'
                    );
                    e.isNetwork = true;
                    throw e;
                }

                const text = await res.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch {
                    throw new Error(
                        `Upload server returned HTTP ${res.status} but not JSON. ` +
                        `Response started with: "${text.slice(0, 80)}…"`
                    );
                }

                if (!res.ok || !data.ok) {
                    throw new Error(data.error || `Upload failed (HTTP ${res.status})`);
                }
                return data.url;
            }

            try {
                return await attempt();
            } catch (err) {
                if (err.isNetwork) {
                    // single retry for transient network blips
                    await new Promise(r => setTimeout(r, 700));
                    return await attempt();
                }
                throw err;
            }
        }

        // ============== IMAGE UPLOAD PANEL (upload-only) ==============
        const imagePreview     = document.getElementById('regImagePreview');
        const imageHidden      = document.getElementById('image');
        const fileInput        = document.getElementById('regImageFile');
        const fileDrop         = document.getElementById('regFileDrop');
        const fileDropText     = document.getElementById('regFileDropText');
        const uploadStatus     = document.getElementById('regUploadStatus');
        const uploadProgress   = document.getElementById('regUploadProgress');
        const progressBar      = uploadProgress.querySelector('div');

        function setPreview(url) {
            if (url) {
                imagePreview.style.backgroundImage = `url('${resolveImageUrl(url)}')`;
                imagePreview.textContent = '';
            } else {
                imagePreview.style.backgroundImage = '';
                imagePreview.textContent = 'No image';
            }
        }

        fileInput.addEventListener('change', () => {
            if (fileInput.files[0]) handleFileChosen(fileInput.files[0]);
        });

        ['dragenter','dragover'].forEach(ev => fileDrop.addEventListener(ev, e => {
            e.preventDefault(); fileDrop.classList.add('dragover');
        }));
        ['dragleave','drop'].forEach(ev => fileDrop.addEventListener(ev, e => {
            e.preventDefault(); fileDrop.classList.remove('dragover');
        }));
        fileDrop.addEventListener('drop', e => {
            if (e.dataTransfer.files[0]) handleFileChosen(e.dataTransfer.files[0]);
        });

        async function handleFileChosen(file) {
            if (!file.type.startsWith('image/')) {
                setStatus('Please choose an image file.', 'error');
                return;
            }
            setPreview(URL.createObjectURL(file));
            fileDropText.textContent = file.name;
            setStatus('Uploading…');
            uploadProgress.classList.add('active');
            progressBar.style.width = '35%';

            try {
                const rawUrl = await uploadToGitHub(file, document.getElementById('name').value || file.name);
                progressBar.style.width = '100%';
                imageHidden.value = rawUrl;
                setPreview(rawUrl);
                setStatus('Uploaded successfully.', 'ok');
                fileDropText.textContent = 'Image uploaded — click or drop to replace';
            } catch (err) {
                progressBar.style.width = '0';
                setStatus(err.message || 'Upload failed.', 'error');
                fileInput.value = '';
            } finally {
                setTimeout(() => { uploadProgress.classList.remove('active'); progressBar.style.width = '0'; }, 800);
            }
        }

        function setStatus(msg, kind) {
            uploadStatus.textContent = msg;
            uploadStatus.className = 'upload-status' + (kind ? ' ' + kind : '');
        }

        function resetUploader() {
            imageHidden.value = '';
            setPreview('');
            fileDropText.textContent = 'Click or drop an image here (max 5 MB)';
            setStatus('');
            fileInput.value = '';
        }

        // ============== DAYS HELPERS ==============
        function getSelectedDays() {
            const checkboxes = document.querySelectorAll('#daysGroup input[type="checkbox"]:checked');
            const days = Array.from(checkboxes).map(cb => cb.value);
            return days.length > 0 ? days.join(', ') : 'Mon-Sun';
        }

        // ============== FORM SUBMIT ==============
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const imageValue = imageHidden.value.trim();
            if (!imageValue) {
                setStatus('Please upload an image.', 'error');
                return;
            }

            status.textContent = 'Saving to database...';
            submitBtn.disabled = true;
            submitBtn.textContent = 'SAVING...';

            const tags = document.getElementById('tags').value.split(',').map(t => t.trim()).filter(t => t);
            const selectedDays = getSelectedDays();

            const newItem = {
                name: document.getElementById('name').value,
                price: document.getElementById('price').value,
                description: document.getElementById('description').value,
                image: imageValue,
                category: document.getElementById('category').value,
                tags: tags,
                date: new Date().toISOString().split('T')[0],
                available: document.getElementById('available').checked,
                serving: document.getElementById('serving').value || "1 person",
                prepTime: document.getElementById('prepTime').value,
                popularity: document.getElementById('popularity').value,
                spiceLevel: document.getElementById('spiceLevel').value,
                daysAvailable: selectedDays,
                orderTime: document.getElementById('orderTime').value || "8:00 AM - 10:00 PM"
            };

            try {
                await db.collection("menuItems").add(newItem);
                status.textContent = "✅ Item saved successfully!";
                form.reset();
                document.querySelectorAll('#daysGroup input').forEach(cb => cb.checked = false);
                resetUploader();
            } catch (error) {
                console.error(error);
                status.textContent = "❌ Error: " + error.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'SAVE TO DATABASE';
            }
        });

        // ============== SEED SAMPLE DATA ==============
        document.getElementById('seedBtn').addEventListener('click', async () => {
            if (!confirm('This will add sample menu items. Continue?')) return;
            status.textContent = 'Seeding database...';

            const sampleItems = [
                { name: "Signature Kibabs", price: "₦2,500", category: "signature", description: "Tender beef skewers with special spices", image: "dishes/meat-kibab.jpg", tags: ["Popular","Spicy"], serving: "1 person", prepTime: "15-20 mins", popularity: "★★★★★", spiceLevel: "Medium", daysAvailable: "Mon, Tue, Wed, Thu, Fri, Sat", orderTime: "4:00 PM - 10:00 PM", available: true, date: "2026-01-01" },
                { name: "Pounded Yam", price: "₦3,000", category: "main", description: "Served with egusi or vegetable soup", image: "dishes/pounded-yam.jpg", tags: ["Best Seller","Traditional"], serving: "2 persons", prepTime: "20-30 mins", popularity: "★★★★★", spiceLevel: "Mild", daysAvailable: "Mon-Sun", orderTime: "11:00 AM - 9:00 PM", available: true, date: "2026-01-01" },
                { name: "Pepper Soup", price: "₦2,000", category: "soups", description: "Spicy cow leg pepper soup", image: "dishes/pepper-soup.jpg", tags: ["Hot","Spicy"], serving: "1 person", prepTime: "15-20 mins", popularity: "★★★★☆", spiceLevel: "Hot", daysAvailable: "Fri, Sat, Sun", orderTime: "6:00 PM - 11:00 PM", available: true, date: "2026-01-01" },
                { name: "Tea", price: "₦2,000", category: "Tea", description: "Spicy cow leg pepper soup", image: "dishes/tea.jpg", tags: ["Hot","Spicy"], serving: "1 person", prepTime: "15-20 mins", popularity: "★★★★☆", spiceLevel: "Hot", daysAvailable: "Fri, Sat, Sun", orderTime: "6:00 PM - 11:00 PM", available: true, date: "2026-01-01" },
                { name: "Loaded Chips", price: "₦1,800", category: "snacks", description: "Crispy chips with cheese and beef", image: "dishes/loaded-chips.jpg", tags: ["Snack","Cheesy"], serving: "1 person", prepTime: "10-15 mins", popularity: "★★★★☆", spiceLevel: "Mild", daysAvailable: "Mon-Sun", orderTime: "12:00 PM - 9:00 PM", available: true, date: "2026-01-01" },
                { name: "Special Rice", price: "₦2,800", category: "main", description: "Spiced rice with grilled chicken", image: "dishes/special-rice.jpg", tags: ["Popular"], serving: "1-2 persons", prepTime: "20-30 mins", popularity: "★★★★★", spiceLevel: "Medium", daysAvailable: "Mon-Sun", orderTime: "11:00 AM - 9:00 PM", available: true, date: "2026-01-01" },
                { name: "Masa & Cowleg", price: "₦2,500", category: "signature", description: "Rice cakes with rich cow leg soup", image: "dishes/masa-cowleg.jpg", tags: ["Traditional","Best Seller"], serving: "2 persons", prepTime: "25-35 mins", popularity: "★★★★★", spiceLevel: "Medium", daysAvailable: "Fri, Sat, Sun", orderTime: "5:00 PM - 10:00 PM", available: true, date: "2026-01-01" }
            ];

            try {
                for (let item of sampleItems) {
                    await db.collection("menuItems").add(item);
                }
                status.textContent = "✅ Sample items added!";
            } catch (error) {
                console.error(error);
                status.textContent = "❌ Error seeding: " + error.message;
            }
        });
    </script>
</body>
</html>
