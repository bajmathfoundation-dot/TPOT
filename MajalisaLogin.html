<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TPOT Shop | Majalisa Login</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #e8f0e6 0%, #d4e0cf 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }

        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1a3a1e;
            letter-spacing: -0.5px;
        }

        .brand p {
            color: #4a6741;
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.02);
            overflow: hidden;
        }

        .card-header {
            padding: 1.75rem 1.75rem 0.5rem 1.75rem;
        }

        .card-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a2c1c;
        }

        .card-header p {
            color: #6b7a64;
            font-size: 0.85rem;
            margin-top: 0.35rem;
        }

        .card-body {
            padding: 1.5rem 1.75rem 1.75rem;
        }

        .form-group {
            margin-bottom: 1.35rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #2c3e2a;
            margin-bottom: 0.5rem;
        }

        .required {
            color: #c23d3d;
            margin-left: 2px;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            font-family: inherit;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            background: #fefefe;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus {
            border-color: #8ba888;
            box-shadow: 0 0 0 3px rgba(100, 130, 80, 0.12);
        }

        .btn {
            background: #2a4230;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            padding: 0.9rem 1.25rem;
            border: none;
            border-radius: 40px;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s, transform 0.05s;
            font-family: inherit;
            margin-top: 0.5rem;
        }

        .btn:hover {
            background: #1f3325;
        }

        .btn:disabled {
            background: #9aae94;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-secondary {
            background: #f0f2f5;
            color: #2c3e2a;
            border: 1px solid #dce3e8;
            margin-top: 0.75rem;
        }

        .btn-secondary:hover {
            background: #e4e9ed;
        }

        .message-box {
            margin-top: 1.25rem;
            padding: 0.85rem 1rem;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 450;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .message-box.error {
            background: #ffebee;
            border-left: 4px solid #f44336;
            color: #c62828;
            display: flex;
        }

        .message-box.success {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            color: #2e7d32;
            display: flex;
        }

        .message-box.info {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            color: #1565c0;
            display: flex;
        }

        .message-box.loading {
            background: #f5f5f5;
            border-left: 4px solid #9e9e9e;
            color: #616161;
            display: flex;
        }

        .divider {
            text-align: center;
            margin: 1.5rem 0 1rem;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e2e8f0;
        }

        .divider span {
            background: white;
            padding: 0 1rem;
            position: relative;
            font-size: 0.75rem;
            color: #8b9a83;
        }

        .footer-links {
            text-align: center;
            margin-top: 1.5rem;
        }

        .footer-links a {
            color: #4a6741;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .demo-note {
            background: #f9fafb;
            border-radius: 14px;
            padding: 0.75rem;
            margin-top: 1rem;
            font-size: 0.7rem;
            color: #8b9a83;
            text-align: center;
            border: 1px solid #eef2f5;
        }

        @media (max-width: 550px) {
            .card-body {
                padding: 1.25rem;
            }
            .card-header {
                padding: 1.5rem 1.25rem 0.25rem 1.25rem;
            }
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="brand">
        <h1>🧆 TPOT Shop</h1>
        <p>Majalisa Organizer Portal</p>
    </div>

    <div class="card">
        <div class="card-header">
            <h2>Welcome back</h2>
            <p>Login to manage your majalisa</p>
        </div>
        <div class="card-body">
            <form id="loginForm">
                <div class="form-group">
                    <label>Majalisa Name / Username <span class="required">*</span></label>
                    <input type="text" id="loginUsername" placeholder="Enter your majalisa name" autocomplete="off" autofocus>
                </div>
                <div class="form-group">
                    <label>Password <span class="required">*</span></label>
                    <input type="password" id="loginPassword" placeholder="Enter your password">
                </div>
                <button type="submit" class="btn" id="loginBtn">Login to Dashboard</button>
            </form>

            <div id="loginMessage" class="message-box"></div>

            <div class="divider">
                <span>New to TPOT?</span>
            </div>
            <button class="btn btn-secondary" id="verifyNewBtn"> Verify Your Majalisa</button>
            <button class="btn btn-secondary" id="createNewBtn">+ Create New Majalisa Profile</button>

            <div class="demo-note">
                🔒 Secure login. Your majalisa data is protected.
            </div>
        </div>
    </div>

    <div class="footer-links">
        <a href="#">Need help?</a> &nbsp;|&nbsp;
        <a href="#">Contact TPOT Support</a>
    </div>
</div>

<script>
    // Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyDRKWldl8_NSAek4na-H-SQWjUBrxt26iI",
        authDomain: "tpot.com.ng",
        projectId: "t-pot-60c3d",
        storageBucket: "t-pot-60c3d.firebasestorage.app",
        messagingSenderId: "272048176539",
        appId: "1:272048176539:web:d73d09a39171c8ef12753e"
    };
    
    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    console.log("Firebase initialized - Login Page");

    // DOM Elements
    const loginForm = document.getElementById('loginForm');
    const loginUsername = document.getElementById('loginUsername');
    const loginPassword = document.getElementById('loginPassword');
    const loginBtn = document.getElementById('loginBtn');
    const loginMessage = document.getElementById('loginMessage');
	const verifyNewBtn = document.getElementById('verifyNewBtn');
    const createNewBtn = document.getElementById('createNewBtn');

    // Helper: Show message
    function showMessage(element, text, type) {
        element.innerHTML = text;
        element.className = 'message-box ' + type;
        element.style.display = 'flex';
        setTimeout(() => {
            if (element.style.display === 'flex') {
                element.style.display = 'none';
            }
        }, 5000);
    }

    // Simple hash function for verification (matches the one used in profile creation)
    // In production, use proper bcrypt or Firebase Auth. This is a demo implementation.
    async function verifyPassword(inputPassword, storedHash, storedSalt, majalisaId) {
        // Recreate the hash using the same method as during profile creation
        const computedHash = btoa(inputPassword + storedSalt + majalisaId);
        return computedHash === storedHash;
    }

    // Handle login
    async function handleLogin(event) {
        event.preventDefault();
        
        const username = loginUsername.value.trim();
        const password = loginPassword.value;
        
        if (!username) {
            showMessage(loginMessage, 'Please enter your majalisa name.', 'error');
            return;
        }
        
        if (!password) {
            showMessage(loginMessage, 'Please enter your password.', 'error');
            return;
        }
        
        // Disable button and show loading
        loginBtn.disabled = true;
        loginBtn.textContent = 'Logging in...';
        showMessage(loginMessage, 'Checking credentials...', 'loading');
        
        try {
            // Query Firestore for majalisa with matching name
            const querySnapshot = await db.collection('majalisa')
                .where('majalisaName', '==', username)
                .limit(1)
                .get();
            
            if (querySnapshot.empty) {
                showMessage(loginMessage, '❌ Majalisa not found. Please check the name or create a new profile.', 'error');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login to Dashboard';
                return;
            }
            
            const doc = querySnapshot.docs[0];
            const majalisaData = doc.data();
            const majalisaId = doc.id;
            
            // Check if profile has been created (has password hash)
            if (!majalisaData.hasProfile && !majalisaData.passwordHash) {
                showMessage(loginMessage, '⚠️ This majalisa exists but doesn\'t have a profile yet. Please create a profile first using "Create New Majalisa Profile".', 'error');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login to Dashboard';
                return;
            }
            
            // Verify password
            const isValid = await verifyPassword(
                password,
                majalisaData.passwordHash,
                majalisaData.passwordSalt,
                majalisaId
            );
            
            if (!isValid) {
                showMessage(loginMessage, '❌ Incorrect password. Please try again.', 'error');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login to Dashboard';
                return;
            }
            
            // Login successful!
            // Store session info in localStorage (for demo purposes)
            const sessionData = {
                majalisaId: majalisaId,
                majalisaName: majalisaData.majalisaName,
                location: majalisaData.location,
                groupType: majalisaData.groupType,
                contactPhone: majalisaData.contactPhone,
                contactEmail: majalisaData.contactEmail,
                loginTime: new Date().toISOString()
            };
            localStorage.setItem('tpot_majalisa_session', JSON.stringify(sessionData));
            
            showMessage(loginMessage, `✅ Welcome back, ${majalisaData.majalisaName}! Redirecting to dashboard...`, 'success');
            
            // Redirect to dashboard after short delay
            setTimeout(() => {
                // In production, redirect to dashboard page
                window.location.href = 'MajalisaDashboard.html';
            }, 1500);
            
        } catch (error) {
            console.error('Login error:', error);
            showMessage(loginMessage, `Error: ${error.message}. Please try again.`, 'error');
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = 'Login to Dashboard';
        }
    }
    
    // Redirect to profile creation page
	function goToVerifyProfile() {
        // Redirect to the verification & profile creation page
        window.location.href = 'MajalisaVerification&Profile.html';
    }
    function goToCreateProfile() {
        // Redirect to the verification & profile creation page
        window.location.href = 'CreateMajalisa.html';
    }
    
    // Event listeners
    loginForm.addEventListener('submit', handleLogin);
    createNewBtn.addEventListener('click', goToCreateProfile);
    verifyNewBtn.addEventListener('click', goToVerifyProfile);
    // Allow Enter key to submit
    loginPassword.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            loginForm.dispatchEvent(new Event('submit'));
        }
    });
    loginUsername.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            loginForm.dispatchEvent(new Event('submit'));
        }
    });
    
    // Check if already logged in (optional redirect)
    const existingSession = localStorage.getItem('tpot_majalisa_session');
    if (existingSession) {
        try {
            const session = JSON.parse(existingSession);
            const loginTime = new Date(session.loginTime);
            const now = new Date();
            const hoursDiff = (now - loginTime) / (1000 * 60 * 60);
            if (hoursDiff < 24) {
                // Session still valid, maybe auto-redirect? We'll show a small message but not auto-redirect
                console.log('Existing session found for:', session.majalisaName);
            } else {
                localStorage.removeItem('tpot_majalisa_session');
            }
        } catch(e) {
            localStorage.removeItem('tpot_majalisa_session');
        }
    }
</script>
</body>
</html>
